name: Release

# Builds the installers and attaches them to a DRAFT GitHub Release (publish it by hand after a look):
#   Windows: NSIS per-user installer (.exe)
#   macOS:   universal .dmg (Apple Silicon + Intel)
# Runs on a version tag (v0.1.0, ...) or by hand (then the tag is v + the version in tauri.conf.json).
# PUBLIC REPO ONLY: in a private repo every job is skipped, so macOS minutes (billed at 10x on private repos) are
# never spent by accident.
#
# macOS releases require all Apple secrets below; the workflow stops before creating a draft if any are absent.
#   macOS (signs + notarises + staples):
#     APPLE_CERTIFICATE            base64 of the "Developer ID Application" .p12
#     APPLE_CERTIFICATE_PASSWORD   password the .p12 was exported with
#     APPLE_SIGNING_IDENTITY       "Developer ID Application: Your Name (TEAMID)"
#     APPLE_ID                     your Apple ID email
#     APPLE_PASSWORD               app-specific password from appleid.apple.com (not the account password)
#     APPLE_TEAM_ID                10-character team ID (developer.apple.com/account > Membership)
#   Windows (Azure Artifact Signing, formerly Trusted Signing; SmartScreen reputation builds over the first weeks):
#     AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET   service principal with the Certificate Profile
#                                                             Signer role on the signing account/profile
#     AZURE_SIGNING_ENDPOINT       e.g. https://eus.codesigning.azure.net
#     AZURE_SIGNING_ACCOUNT        Trusted Signing account name
#     AZURE_SIGNING_PROFILE        certificate profile name

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  NODE_VERSION: '24'
  # Secrets cannot be read directly in step conditions.
  MACOS_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
  WINDOWS_SIGNING: ${{ secrets.AZURE_CLIENT_SECRET != '' }}

jobs:
  draft:
    name: Draft release
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Require macOS signing credentials
        run: |
          if [ "$MACOS_SIGNING" != "true" ]; then
            echo '::error::Set all six APPLE_* repository secrets before creating a release.'
            exit 1
          fi
      - id: tag
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then tag="${{ github.ref_name }}"
          else tag="v$(node -p "require('./app/src-tauri/tauri.conf.json').version")"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Create the draft (once)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 && exit 0
          cat > notes.md <<'EOF'
          **Windows:** download the `.exe` and run it.
          **macOS (Apple Silicon or Intel):** download the `.dmg`, open it and drag SPYDER Bone to Applications.
          EOF
          if [ "$WINDOWS_SIGNING" != "true" ]; then
          cat >> notes.md <<'EOF'

          This Windows build is not signed yet, so the first run shows "Windows protected your PC": click
          **More info**, then **Run anyway**.
          EOF
          fi
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "SPYDER Bone $TAG" --notes-file notes.md

  installers:
    name: Installer (${{ matrix.name }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --bundles nsis
            files: target/release/bundle/nsis/*.exe
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            files: target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - name: Both Mac architectures
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      - run: npm ci
        working-directory: app/ui

      - name: tauri build (Windows)
        if: runner.os == 'Windows'
        working-directory: app/src-tauri
        run: ../ui/node_modules/.bin/tauri build ${{ matrix.args }}

      # Tauri imports the certificate, signs and notarises the app bundle.
      - name: tauri build (signed + notarised)
        if: runner.os == 'macOS'
        working-directory: app/src-tauri
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ../ui/node_modules/.bin/tauri build ${{ matrix.args }}

      - name: Notarize, staple and verify disk image
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          shopt -s nullglob
          images=(target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          apps=(target/universal-apple-darwin/release/bundle/macos/*.app)
          if [ "${#images[@]}" -ne 1 ]; then
            echo '::error::Expected exactly one macOS disk image.'
            exit 1
          fi
          if [ "${#apps[@]}" -ne 1 ]; then
            echo '::error::Expected exactly one macOS app bundle.'
            exit 1
          fi
          codesign --verify --deep --strict "${apps[0]}"
          xcrun stapler validate "${apps[0]}"
          xcrun notarytool submit "${images[0]}" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "${images[0]}"
          xcrun stapler validate "${images[0]}"
          spctl --assess --type open --context context:primary-signature --verbose "${images[0]}"

      - name: Sign installer (Azure Artifact Signing)
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING == 'true'
        uses: Azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}/target/release/bundle/nsis
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.draft.outputs.tag }}" ${{ matrix.files }} --clobber
