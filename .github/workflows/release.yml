name: Release

# Builds the installers and attaches them to a DRAFT GitHub Release (publish it by hand after a look):
#   Windows: NSIS per-user installer (.exe)
#   macOS:   universal .dmg (Apple Silicon + Intel)
# Runs on a version tag (v0.1.0, ...) or by hand (then the tag is v + the version in tauri.conf.json).
# PUBLIC REPO ONLY: in a private repo every job is skipped, so macOS minutes (billed at 10x on private repos) are
# never spent by accident.
#
# Unsigned for now: Windows SmartScreen and macOS Gatekeeper warn on first open (the release text says how to get
# past it). Signing is added later with repository secrets (Apple Developer ID + notarisation; a Windows
# code-signing service), without changing the rest of this file.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  NODE_VERSION: '24'

jobs:
  draft:
    name: Draft release
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then tag="${{ github.ref_name }}"
          else tag="v$(node -p "require('./app/src-tauri/tauri.conf.json').version")"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Create the draft (once)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 && exit 0
          cat > notes.md <<'EOF'
          **Windows:** download the `.exe` and run it.
          **macOS (Apple Silicon or Intel):** download the `.dmg`, open it and drag SPYDER Bone to Applications.

          These test builds are not yet signed. Windows shows "Windows protected your PC": click **More info**, then
          **Run anyway**. macOS blocks the first open: right-click the app and choose **Open** (or System Settings >
          Privacy & Security > **Open Anyway**).
          EOF
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "SPYDER Bone $TAG" --notes-file notes.md

  installers:
    name: Installer (${{ matrix.name }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --bundles nsis
            files: target/release/bundle/nsis/*.exe
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            files: target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - name: Both Mac architectures
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      - run: npm ci
        working-directory: app/ui

      - name: tauri build
        working-directory: app/src-tauri
        run: ../ui/node_modules/.bin/tauri build ${{ matrix.args }}

      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.draft.outputs.tag }}" ${{ matrix.files }} --clobber
