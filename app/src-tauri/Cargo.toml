[package]
name = "spyder-bone-app"
description = "SPYDER Bone desktop shell (Tauri 2). Thin: commands, menus, capabilities. All maths lives in spyder-core."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
default-run = "spyder-bone-app"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo issue #8519).
name = "spyder_bone_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spyder-watch = { path = "watch" }
spyder-core = { path = "../../crates/spyder-core" }
